# CI — runs unit tests, typecheck, lint, and (crucially) the Postgres
# integration/concurrency tests that cannot run locally because hardware
# virtualization is disabled on the dev machine.
#
# The integration tests self-guard on database availability; with the Postgres
# service below + DATABASE_URL set, they EXECUTE here (they SKIP locally).
#
# NOTE: full reliability of the concurrency/race suite depends on the pending
# PR 2b remediation (finding pr2b-M3: run integration tests serially + apply
# migrations in a global setup; pr2b-M5: barrier-force every declared race).
# Until that lands, treat integration results here as indicative, not final.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivetutiempo
          POSTGRES_PASSWORD: vivetutiempo
          POSTGRES_DB: vivetutiempo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vivetutiempo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://vivetutiempo:vivetutiempo@localhost:5432/vivetutiempo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (unit + Postgres integration/concurrency)
        run: npm run test
