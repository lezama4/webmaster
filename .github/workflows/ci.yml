# CI — runs unit tests, typecheck, lint, and (crucially) the Postgres
# integration/concurrency tests that cannot run locally because hardware
# virtualization is disabled on the dev machine.
#
# The integration tests self-guard on database availability; with the Postgres
# service below + DATABASE_URL set, they EXECUTE here (they SKIP locally).
#
# The PR-2b remediation this comment used to flag as pending has landed: the
# integration project runs serially with migrations applied in a global setup,
# and every declared race is barrier-forced. Integration/e2e results here are
# final, not indicative.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivetutiempo
          POSTGRES_PASSWORD: vivetutiempo
          POSTGRES_DB: vivetutiempo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vivetutiempo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://vivetutiempo:vivetutiempo@localhost:5432/vivetutiempo
      # Non-production deterministic values required by the Postgres-backed
      # rate limiter. Production uses separately managed secrets; these exist
      # only so integration/race tests exercise the real HMAC key path.
      SESSION_SECRET: ci-session-secret-not-for-production-0123456789
      RATE_LIMIT_HMAC_SECRET: ci-rate-limit-hmac-secret-not-for-production-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # node 22 ships npm 10.x, which reads the npm-11-generated lockfile
      # differently and fails `npm ci` ("Missing: magicast from lock file").
      # Pin npm to the version that generated package-lock.json.
      - name: Pin npm to match the lockfile
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (unit + Postgres integration/concurrency)
        run: npm run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm to match the lockfile
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      # Gate on CRITICAL only. High-severity transitive advisories (currently
      # via `sharp`, pulled by Next's image optimiser) are tracked by
      # Dependabot; raising the bar to `high` here would require a Next upgrade
      # the maintainer must vet first — see the PR description.
      - name: Audit dependencies (fail on critical)
        run: npm audit --audit-level=critical

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivetutiempo
          POSTGRES_PASSWORD: vivetutiempo
          POSTGRES_DB: vivetutiempo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vivetutiempo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://vivetutiempo:vivetutiempo@localhost:5432/vivetutiempo
      SESSION_SECRET: ci-session-secret-not-for-production-0123456789
      RATE_LIMIT_HMAC_SECRET: ci-rate-limit-hmac-secret-not-for-production-0123456789
      # The CSRF guard fails closed unless the request Origin matches this
      # canonical origin. Playwright's dev server runs on localhost:3000, and
      # the same-origin UI/API calls it makes carry that Origin — so it must
      # match here for any authenticated mutation to pass.
      APP_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm to match the lockfile
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed the demo dataset
        run: npm run db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright against real Postgres)
        run: npm run test:e2e
