version: 2
updates:
  # Application dependencies. Grouped so a routine bump is one PR, not dozens.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    # Majors that break the build and need a deliberate migration, not a
    # routine bump. Remove an entry when its migration lands.
    ignore:
      # Prisma 7 drops `datasource.url` from schema.prisma (P1012) — see #84.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # Must stay within eslint-config-next's peer ranges.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Keep the CI workflow actions patched (supply-chain surface).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
