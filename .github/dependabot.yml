version: 2
updates:
  # Application dependencies. Grouped so a routine bump is one PR, not dozens.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      # Test tooling whose bumps can break CI on their own (new axe rules,
      # Vitest majors) gets its own PR so it never blocks the routine group.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      axe:
        patterns: ["@axe-core/*", "axe-core"]
      development-dependencies:
        dependency-type: development
        exclude-patterns: ["vitest", "@vitest/*", "@axe-core/*", "axe-core"]
    # Majors that break the build and need a deliberate migration, not a
    # routine bump. Remove an entry when its migration lands.
    ignore:
      # Prisma 7 drops `datasource.url` from schema.prisma (P1012) — see #84.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # Must stay within eslint-config-next's peer ranges.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Types must match the runtime major (Node 24 in CI and Vercel, from .nvmrc); bump it
      # by hand together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keep the CI workflow actions patched (supply-chain surface).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
