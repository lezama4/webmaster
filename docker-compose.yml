services:
  postgres:
    image: postgres:16-alpine
    container_name: vivetutiempo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivetutiempo
      POSTGRES_PASSWORD: vivetutiempo
      POSTGRES_DB: vivetutiempo
    ports:
      - "5432:5432"
    volumes:
      - vivetutiempo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivetutiempo -d vivetutiempo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vivetutiempo-postgres-data:
